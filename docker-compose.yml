services:
  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: vera_api
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vera}
      DB_USERNAME: ${DB_USERNAME:-vera}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env (ver .env.example)}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:?Define MEILISEARCH_KEY en tu .env (ver .env.example)}
      # Solo aplica en produccion (docker-compose.yml solo, sin el override
      # de desarrollo) - Redis compartido con el host, seccion 2 del
      # CLAUDE.md raiz. En desarrollo, docker-compose.override.yml
      # sobreescribe esto con REDIS_HOST=redis.
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mariadb
      - meilisearch
    networks:
      - vera

  mariadb:
    image: mariadb:11
    container_name: vera_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-vera}
      MARIADB_USER: ${DB_USERNAME:-vera}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu .env (ver .env.example)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en tu .env (ver .env.example)}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/vera.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - vera

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: vera_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?Define MEILISEARCH_KEY en tu .env (ver .env.example)}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - vera

volumes:
  mariadb_data:
  meilisearch_data:

networks:
  vera:
    driver: bridge
